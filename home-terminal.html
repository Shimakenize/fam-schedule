<!DOCTYPE html>
<html lang="ja" class="remote">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ダイニングTV">
  <title>ダイニングTV</title>
  <style>
    :root {
      --bg: #0a0d12;
      --panel: #141821;
      --line: #2a303a;
      --text: #f2eee6;
      --muted: #8d939c;
      --gold: #c9b08a;
      --gold-2: #e8d7b8;
      --today: #4a6f96;
      --tl-bg: #f6f2ea;
      --tl-alt: #efe9de;
      --tl-line: #ddd3c4;
      --tl-ink: #1b1916;
      --rail: 72px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 1920px; height: 1080px; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif;
    }
    html.pc, html.pc body { background: #000; }
    html.pc {
      width: 100%; height: 100%; overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    html.pc body {
      position: absolute; width: 1920px; height: 1080px;
      transform-origin: top left;
      touch-action: none;
      overscroll-behavior: none;
    }
    html.pc.phone {
      touch-action: manipulation;
    }
    html.pc.phone body {
      touch-action: manipulation;
    }
    body {
      display: flex; flex-direction: column; padding: 14px 28px 12px; position: relative;
    }
    body::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; z-index: 40;
      background: linear-gradient(90deg, transparent 8%, var(--gold) 50%, transparent 92%);
      opacity: 0.85;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      flex: 0 0 76px; gap: 18px;
    }
    .hdr-left { min-width: 240px; }
    h1 {
      margin: 0; font-size: 28px; font-weight: 500; letter-spacing: 0.38em;
      padding-left: 0.1em; color: var(--gold-2);
    }
    .clock {
      font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em; color: var(--text);
    }
    .sub { color: var(--muted); font-size: 15px; margin-top: 3px; letter-spacing: 0.08em; }
    #status { color: var(--muted); font-size: 13px; letter-spacing: 0.06em; }
    .hdr-filters { display: flex; gap: 8px; }
    .hdr-cat, .hdr-view { display: flex; gap: 6px; flex-shrink: 0; }
    .hdr-view { flex-wrap: wrap; justify-content: flex-end; }
    body.study-debug .hdr-cat,
    body.study-debug .week-keys { display: none; }
    .hdr-gap { flex: 1; min-width: 28px; }
    .hdr-filters button, .hdr-cat button, .hdr-view button {
      min-width: 96px; height: 44px; border-radius: 999px;
      border: 1px solid #3a414c; background: transparent; color: #c5c0b6;
      font-size: 16px; font-weight: 600; letter-spacing: 0.06em;
    }
    .hdr-view button {
      min-width: 0; padding: 0 10px; font-size: 13px; letter-spacing: 0.02em; white-space: nowrap;
    }
    .hdr-filters button.on, .hdr-cat button.on, .hdr-view button.on {
      border-color: var(--gold); background: rgba(201,176,138,0.12); color: var(--gold-2);
    }
    .hdr-filters button.nav, .hdr-cat button.nav, .hdr-view button.nav {
      box-shadow: 0 0 0 2px rgba(201,176,138,0.55);
    }
    .hdr-view button.alert {
      border-color: #f59e0b; color: #fbbf24;
      background: rgba(245,158,11,0.16);
      animation: trPulse 1.7s ease-in-out infinite;
    }
    .hdr-view button.alert.stop {
      border-color: #ef4444; color: #fecaca;
      background: rgba(239,68,68,0.2);
    }
    .week-keys { display: flex; gap: 8px; }
    .wk {
      min-width: 118px; height: 44px; border-radius: 999px; border: 1px solid;
      font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: 0.04em;
    }
    .wk-g { background: transparent; border-color: #3d8f5c; color: #b7e4c4; }
    .wk-b { background: transparent; border-color: #5a86c4; color: #c9daf8; }
    .wk-y { background: transparent; border-color: #c4a035; color: #f3e2a1; }
    .wk.on { background: rgba(255,255,255,0.06); box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }
    body.mode-week .days { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    body.mode-focus .hours { width: 100px; }
    body.mode-focus .hour-lab { font-size: 22px; right: 8px; }
    body.mode-focus .day-head { flex: 0 0 76px; padding-top: 8px; }
    body.mode-focus .dow { font-size: 22px; }
    body.mode-focus .dom { font-size: 36px; }
    body.mode-focus .tl-block { font-size: 22px; line-height: 1.25; }
    body.mode-focus .tl-block-seg { padding: 6px 10px; }
    body.mode-focus .tl-block-seg-time { font-size: 22px; }
    body.mode-focus .tl-block-seg-sub { font-size: 20px; }
    body.mode-focus .tl-block-seg-venue { font-size: 18px; }
    body.mode-focus .tl-block-seg-regalia { font-size: 20px; }
    body.mode-focus .tl-block-seg--postmark { font-size: 18px; }
    body.mode-focus .wx-lab,
    body.mode-focus .wx-cell,
    body.mode-week .wx-lab,
    body.mode-week .wx-cell { display: none !important; }
    .hours-head {
      flex: 0 0 44px; border-bottom: 1px solid var(--tl-line);
    }
    body.mode-focus .hours-head { flex: 0 0 76px; }
    .day-body {
      flex: 1; min-height: 0; display: flex; align-items: stretch;
    }
    .day-body .canvas { flex: 1; min-width: 0; }
    .wx-rails { display: none; }
    body.mode-focus .wx-rails {
      display: flex; flex: 0 0 176px; width: 176px;
      border-right: 1px solid var(--tl-line);
    }
    body.mode-week .wx-rails {
      display: flex; flex: 0 0 96px; width: 96px;
      border-right: 1px solid var(--tl-line);
    }
    .wx-rail {
      flex: 1 1 0; position: relative; background: #0d1524; min-width: 0;
      border-left: 1px solid #1f2937;
    }
    .wx-rail.nav { box-shadow: inset 0 0 0 2px var(--gold); z-index: 2; }
    .wx-rail-tag {
      position: absolute; top: 4px; left: 0; right: 0; z-index: 3;
      text-align: center; font-size: 12px; font-weight: 700; color: var(--gold);
      pointer-events: none; letter-spacing: 0.08em;
    }
    .wx-hour {
      position: absolute; left: 0; right: 0; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0; border-top: 1px solid rgba(51,65,85,0.55); box-sizing: border-box;
    }
    .wx-hour .wx-ico { width: 22px; height: 22px; flex: 0 0 22px; }
    .wx-ht { font-size: 13px; font-weight: 800; line-height: 1.1; color: #e8eef7; }
    .wx-hmm { font-size: 11px; font-weight: 800; line-height: 1; color: #94a3b8; }
    .wx-hour.rain-light { background: #155e75; }
    .wx-hour.rain-light .wx-hmm { color: #a5f3fc; }
    .wx-hour.rain-mid { background: #1e3a8a; }
    .wx-hour.rain-mid .wx-hmm { color: #bfdbfe; }
    .wx-hour.rain-heavy { background: #7f1d1d; }
    .wx-hour.rain-heavy .wx-hmm { color: #fecaca; }
    .wx-hour.is-now { box-shadow: inset 0 0 0 2px #facc15; }
    body.mode-week .wx-rail-tag { font-size: 10px; top: 2px; }
    body.mode-week .wx-hour .wx-ico { width: 14px; height: 14px; flex: 0 0 14px; }
    body.mode-week .wx-ht { font-size: 10px; }
    body.mode-week .wx-hmm { font-size: 9px; }
    #tl-wrap {
      flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 0;
    }
    #mid {
      flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
      position: relative;
    }
    #tl {
      flex: 1; min-height: 0; background: var(--tl-bg); color: var(--tl-ink);
      border: 1px solid rgba(201,176,138,0.18);
      border-radius: 4px; display: flex;
      overflow: hidden; position: relative;
      box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    }
    #tl[hidden] { display: none !important; }
    .hours {
      width: var(--rail); flex-shrink: 0; border-right: 1px solid var(--tl-line);
      background: var(--tl-alt); display: flex; flex-direction: column;
    }
    #wx-board {
      flex: 1; min-height: 0; background: linear-gradient(180deg, #12151c 0%, #0c0e13 100%);
      color: var(--text);
      border: 1px solid rgba(201,176,138,0.22); border-radius: 4px;
      display: flex; flex-direction: column; padding: 14px 18px 16px;
      overflow: hidden;
    }
    #wx-board[hidden] { display: none !important; }
    #brief-board, #transit-board, #week-head-board {
      flex: 1; min-height: 0;
      background: linear-gradient(180deg, #12151c 0%, #0c0e13 100%);
      color: var(--text);
      border: 1px solid rgba(201,176,138,0.22); border-radius: 4px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #brief-board[hidden], #transit-board[hidden], #week-head-board[hidden],
    #study-board[hidden] { display: none !important; }
    #study-board {
      flex: 1; min-height: 0;
      background: linear-gradient(180deg, #12151c 0%, #0c0e13 100%);
      color: var(--text);
      border: 1px solid rgba(201,176,138,0.22); border-radius: 4px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
      padding: 14px 18px 12px;
    }
    #study-board.study-one {
      grid-template-rows: auto minmax(0, 1fr);
    }
    .study-banner {
      display: flex; align-items: baseline; gap: 14px; flex-shrink: 0;
      min-height: 0;
    }
    .study-banner .n {
      font-size: 36px; font-weight: 700; color: var(--gold-2); letter-spacing: 0.04em; line-height: 1;
    }
    .study-banner .lab { font-size: 16px; color: var(--gold); letter-spacing: 0.12em; }
    .study-banner .sub { font-size: 15px; color: var(--muted); }
    .study-deck {
      min-width: 0; min-height: 0;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .study-panel {
      min-width: 0; min-height: 0; overflow: hidden;
      border: 1px solid rgba(201,176,138,0.16); border-radius: 8px;
      background: rgba(255,255,255,0.03); padding: 12px 14px 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .study-panel h2 {
      margin: 0; font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 0.12em;
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    }
    .study-panel h2 .hint { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
    .study-meters {
      flex: 1; min-height: 0; overflow: hidden;
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;
      align-items: stretch;
    }
    .study-panel.sub-rik {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(8, 47, 73, 0.42);
    }
    .study-panel.sub-sha {
      border-color: rgba(251, 146, 60, 0.55);
      background: rgba(67, 20, 7, 0.42);
    }
    .study-panel.sub-rik h2 { color: #7dd3fc; }
    .study-panel.sub-sha h2 { color: #fdba74; }
    .study-meter {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column; justify-content: flex-start; gap: 4px;
      padding: 8px 8px 10px; border-radius: 8px;
      border: 1px solid rgba(201,176,138,0.16);
      background: rgba(12,14,19,0.45); overflow: hidden;
    }
    .study-meter .k { font-size: 14px; color: #c5c0b6; flex-shrink: 0; }
    .study-meter .done, .study-meter .left {
      font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15;
      flex-shrink: 0;
    }
    .study-meter .done { color: #86efac; }
    .study-meter .left { color: #fbbf24; }
    .study-meter.ok .left { color: #86efac; }
    .study-meter .hero {
      flex: 1 0 auto;
      min-height: 52px;
      font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1;
      color: #fbbf24; letter-spacing: -0.04em; text-align: center;
      display: flex; align-items: center; justify-content: center;
    }
    .study-meter.ok .hero { color: #86efac; }
    .study-meter.miss .hero, .study-meter.mute .hero { color: #8a8070; }
    .study-meter .pct {
      flex-shrink: 0;
      font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1;
      color: #fbbf24; letter-spacing: -0.02em; text-align: center;
    }
    .study-meter.ok .pct { color: #86efac; }
    .study-meter.mute .done, .study-meter.mute .left, .study-meter.mute .pct { color: var(--muted); font-weight: 600; }
    .study-callout { font-size: 12px; color: #fbbf24; }
    .study-tasks {
      flex: 1; min-height: 0; overflow: hidden;
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
      align-content: start;
    }
    .study-task {
      min-width: 0; min-height: 0; aspect-ratio: 1;
      border-radius: 8px; padding: 10px;
      border: 1px solid rgba(201,176,138,0.18);
      background: rgba(12,14,19,0.55);
      display: flex; flex-direction: column; justify-content: center; gap: 4px;
      overflow: hidden; position: relative;
    }
    .study-task .badge {
      position: absolute; top: 6px; right: 6px;
      font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
      padding: 2px 6px; border-radius: 999px; line-height: 1.2;
    }
    .study-task .badge.done {
      background: #166534; color: #bbf7d0;
    }
    .study-task .badge.due {
      background: #854d0e; color: #fef08a;
    }
    .study-task.done {
      opacity: 0.72;
    }
    .study-task.done .ttl { text-decoration: line-through; }
    .study-task.sub-rik {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(8, 47, 73, 0.72);
    }
    .study-task.sub-sha {
      border-color: rgba(251, 146, 60, 0.55);
      background: rgba(67, 20, 7, 0.72);
    }
    .study-task.sub-rik .unit { color: #7dd3fc; }
    .study-task.sub-sug {
      border-color: rgba(196, 181, 253, 0.55);
      background: rgba(46, 16, 101, 0.72);
    }
    .study-task.sub-sha .unit { color: #fdba74; }
    .study-cal-day.exam .items.exam-col {
      grid-template-columns: 1fr;
      grid-auto-rows: minmax(0, 1fr);
    }
    .study-cal-day.exam .study-task { aspect-ratio: auto; min-height: 0; padding: 6px 8px; }
    .study-cal-day .split {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; gap: 6px;
    }
    .study-cal-day .half {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
    }
    .study-cal-day .half.juku { background: rgba(67, 20, 7, 0.45); }
    .study-cal-day .half.buffer { background: rgba(30, 58, 138, 0.4); }
    .study-cal-day .half.cards {
      align-items: stretch; justify-content: stretch; padding: 4px;
      background: rgba(15, 23, 42, 0.35);
    }
    .study-cal-day .half.cards .items { width: 100%; height: 100%; }
    .study-cal-day .half.cards .study-task { min-height: 0; padding: 3px 4px; }
    .study-cal-day .half .banner { font-size: 20px; }
    .study-cal-day.juku-buffer { border-color: rgba(147,197,253,0.45); }
    .study-task.k-exam .kind { color: #fca5a5; }
    .study-task.k-exam .unit { font-size: 22px; }
    .study-task .kind {
      font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: var(--gold);
    }
    .study-task.k-video .kind { color: #93c5fd; }
    .study-task.k-quizFirst .kind { color: #fcd34d; }
    .study-task.k-wrongVideo .kind, .study-task.k-quizRetry .kind { color: #fb7185; }
    .study-task.k-paper .kind { color: #86efac; }
    .study-task .unit { font-size: 18px; font-weight: 700; color: var(--gold-2); line-height: 1.2; }
    .study-task .ttl { font-size: 14px; color: #c5c0b6; }
    .study-empty { font-size: 16px; color: var(--muted); padding: 8px 2px; }
    .study-soon {
      flex: 1; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column; gap: 8px;
    }
    .study-soon-day {
      border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
      padding: 8px 10px; background: rgba(0,0,0,0.18);
    }
    .study-soon-day .h { font-size: 14px; color: var(--gold); margin-bottom: 6px; letter-spacing: 0.08em; }
    .study-soon-day .study-tasks { overflow: visible; grid-template-columns: 1fr 1fr; }
    .study-soon-day .study-task { padding: 8px 10px; }
    .study-soon-day .study-task .unit { font-size: 15px; }
    .study-note { font-size: 14px; color: var(--muted); }
    .study-cal {
      min-width: 0; min-height: 0;
      display: grid; grid-template-rows: 1fr 1fr; gap: 10px;
    }
    .study-cal.one { grid-template-rows: 1fr; }
    .study-cal-row {
      min-width: 0; min-height: 0;
      display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); gap: 8px;
    }
    .study-cal-day {
      min-width: 0; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column; gap: 6px;
      border: 1px solid rgba(201,176,138,0.16); border-radius: 8px;
      background: rgba(255,255,255,0.03); padding: 8px;
    }
    .study-cal-day.today {
      border-color: rgba(201,176,138,0.5); background: rgba(201,176,138,0.08);
    }
    .study-cal-day.exam { border-color: rgba(248,113,113,0.45); }
    .study-cal-day.juku { border-color: rgba(251,146,60,0.45); background: rgba(67, 20, 7, 0.35); }
    .study-cal-day.buffer { border-color: rgba(147,197,253,0.55); background: rgba(30, 58, 138, 0.35); }
    .study-cal-day.finished {
      filter: grayscale(0.92);
      opacity: 0.38;
      background: rgba(6, 8, 12, 0.72);
      border-color: rgba(80, 88, 98, 0.45);
    }
    .study-cal-day.finished .h { color: #9aa3ad; }
    .study-cal-day.finished .banner,
    .study-cal-day.finished .study-task { opacity: 0.85; }
    .study-cal-day.overdue {
      border-color: rgba(250, 204, 21, 0.7);
      background: rgba(28, 18, 4, 0.55);
      box-shadow: inset 0 0 0 1px rgba(250, 204, 21, 0.28);
    }
    .study-cal-day.juku.overdue {
      border-color: rgba(250, 204, 21, 0.7);
      background: rgba(28, 18, 4, 0.55);
    }
    .study-cal-day.overdue .h { color: #e7d3a4; }
    .study-cal-day.overdue .banner,
    .study-cal-day.overdue .half.juku {
      opacity: 0.38;
      filter: grayscale(0.88);
    }
    .study-cal-day.overdue .study-task.done {
      opacity: 0.38;
      filter: grayscale(0.8);
    }
    .study-cal-day.overdue .study-task.active {
      opacity: 1;
      filter: none;
      border-color: rgba(250, 204, 21, 0.85);
      background: rgba(18, 16, 10, 0.95);
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.32);
    }
    .study-cal-day .h {
      flex-shrink: 0; font-size: 13px; font-weight: 700; color: var(--gold);
      letter-spacing: 0.06em;
    }
    .study-cal-day.exam .h { color: #fca5a5; }
    .study-cal-day .banner {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 36px; font-weight: 800; line-height: 1.15;
      color: #93c5fd; letter-spacing: 0.08em;
    }
    .study-cal-day .banner.juku { font-size: 22px; color: #fdba74; }
    .study-cal-day .items {
      flex: 1; min-height: 0; overflow: hidden;
      display: grid; grid-template-columns: repeat(var(--icols, 2), minmax(0, 1fr)); gap: 4px;
      align-content: start;
    }
    .study-task.missing .ttl { color: #fbbf24; }
    .study-cal-day .study-task { padding: 6px; }
    .study-cal-day .study-task .kind { font-size: 10px; }
    .study-cal-day .study-task .unit { font-size: 12px; }
    .study-cal-day .study-task .ttl { font-size: 11px; }
    .ui-ico { display: inline-flex; width: 72px; height: 72px; color: var(--gold-2); }
    .ui-ico svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .brief-grid {
      flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px;
      padding: 16px 24px 12px;
    }
    .brief-main {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px;
    }
    .brief-sec {
